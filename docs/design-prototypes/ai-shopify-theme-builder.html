  document.getElementById('spBody').innerHTML = designAccordionHTML();
  openSidePanel();
  bindDesignPanel();
}

function designAccordionHTML(){
  const d = designTokens;
  const items = [
    {key:'colors', label:'Colors', open:true, body:`
      <div class="field"><label>Palettes</label><div class="swatch-row">${PRESET_PALETTES.map(p=>`<span class="swatch" data-preset="${p.name}" style="background:${p.primary}" title="${p.name}"></span>`).join('')}</div></div>
      <div class="field"><label>Primary (buttons, accents)</label><div class="color-input-wrap"><input type="color" id="dcPrimary" value="${d.primary}"><span class="hex" id="dcPrimaryHex">${d.primary}</span></div></div>

    {key:'type', label:'Typography', body:`

      <div class="field"><label>Body font</label><select id="dcBFont">${FONT_OPTIONS.map(f=>`<option value="${f.v}" ${d.bodyFont===f.v?'selected':''}>${f.n}</option>`).join('')}</select></div>
      <div class="field"><label>Heading weight</label><div class="seg" id="dcHWeight">
        <button data-v="500" class="${d.headingWeight==='500'?'active':''}">Light</button>
        <button data-v="600" class="${d.headingWeight==='600'?'active':''}">Medium</button>
        <button data-v="700" class="${d.headingWeight==='700'?'active':''}">Bold</button></div></div>

    {key:'buttons', label:'Buttons', body:`
      <div class="field"><label>Style</label><div class="seg" id="dcBtnStyle">
        <button data-v="rounded" class="${d.btnStyle==='rounded'?'active':''}">Rounded</button>
        <button data-v="pill" class="${d.btnStyle==='pill'?'active':''}">Pill</button>
        <button data-v="square" class="${d.btnStyle==='square'?'active':''}">Square</button></div></div>`},
    {key:'cards', label:'Cards', body:`
      <div class="toggle-row"><div><div class="tt">Card shadow</div><div class="ts">Soft elevation on product & review cards</div></div><div class="switch ${d.shadow==='on'?'on':''}" id="dcShadow"></div></div>
      <div class="slider-row"><div class="top"><span>Corner radius</span><span id="dcRadiusV">${d.radius}px</span></div><input type="range" id="dcRadius" min="0" max="28" value="${d.radius}"></div>`},

function bindDesignPanel(){
  const body = document.getElementById('spBody');
  body.querySelectorAll('.accordion-head').forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('open'));

  const commitDesign = (label)=>{ commitChange(label||'Design change','design'); applyDesignTokens(); };

  body.querySelectorAll('.swatch[data-preset]').forEach(sw=>sw.onclick=()=>{
    const p = PRESET_PALETTES.find(x=>x.name===sw.dataset.preset);
    designTokens.primary=p.primary; designTokens.secondary=p.secondary; designTokens.bg=p.bg;
    document.getElementById('dcPrimary').value=p.primary; document.getElementById('dcPrimaryHex').textContent=p.primary;
    document.getElementById('dcSecondary').value=p.secondary; document.getElementById('dcSecondaryHex').textContent=p.secondary;
    document.getElementById('dcBg').value=p.bg; document.getElementById('dcBgHex').textContent=p.bg;
    applyDesignTokens(); commitDesign('Applied "'+p.name+'" palette');
  });
  const colorField = (id, key)=>{
    const inp = document.getElementById(id);
    if(!inp) return;
    inp.addEventListener('input', ()=>{ designTokens[key]=inp.value; document.getElementById(id+'Hex').textContent=inp.value; applyDesignTokens(); });
    inp.addEventListener('change', ()=>commitDesign('Changed '+key+' color'));
  };
  colorField('dcPrimary','primary'); colorField('dcSecondary','secondary'); colorField('dcBg','bg');

  const sel = (id, key)=>{ const el=document.getElementById(id); if(!el) return; el.addEventListener('change', ()=>{ designTokens[key]=el.value; applyDesignTokens(); commitDesign('Changed '+key); }); };
  sel('dcHFont','headingFont'); sel('dcBFont','bodyFont');

  const seg = (id, key)=>{ const el=document.getElementById(id); if(!el) return; el.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    el.querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active');
    designTokens[key]=b.dataset.v; applyDesignTokens(); commitDesign('Changed '+key);
  }); };
  seg('dcHWeight','headingWeight'); seg('dcBtnStyle','btnStyle');

  const range = (id, key, suffix, transform)=>{
    const el = document.getElementById(id); if(!el) return;
    const label = document.getElementById(id+'V');
    el.addEventListener('input', ()=>{ const v = transform?transform(el.value):el.value; designTokens[key]=v; if(label) label.textContent=(transform?el.value:v)+(suffix||''); applyDesignTokens(); });
    el.addEventListener('change', ()=>commitDesign('Adjusted '+key));
  };
  range('dcBaseSize','baseSize','px'); range('dcRadius','radius','px'); range('dcImgRadius','imgRadius','px');
  range('dcSpacing','spacing','%', v=>(v/100).toFixed(2));

  const shadowSw = document.getElementById('dcShadow');
  if(shadowSw) shadowSw.onclick = ()=>{ designTokens.shadow = designTokens.shadow==='on'?'off':'on'; shadowSw.classList.toggle('on'); applyDesignTokens(); commitDesign('Toggled card shadow'); };
}

<script>
'use strict';
/* ============================================================
   VIEW ROUTING
   ============================================================ */
const VIEW_INIT = {}; // view name -> init fn, populated later
function goToView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.rail-btn[data-view]').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
  document.getElementById('topbar').style.display = name==='editor' ? 'flex' : 'none';
  if(name!=='editor') { clearSelection(); }
  if(VIEW_INIT[name]) VIEW_INIT[name]();
}

document.querySelectorAll('.rail-btn[data-view]').forEach(btn=>{
  btn.addEventListener('click', ()=>goToView(btn.dataset.view));
});
document.getElementById('designRailBtn').addEventListener('click', openDesignPanel);

/* rail tooltips */
const railTip = document.getElementById('railTip');
document.querySelectorAll('.rail-btn').forEach(btn=>{
  btn.addEventListener('mouseenter', ()=>{
    const r = btn.getBoundingClientRect();
    railTip.textContent = btn.dataset.tip || btn.querySelector('span').textContent;
    railTip.style.top = (r.top + r.height/2 - 12)+'px';
    railTip.classList.add('show');
  });
  btn.addEventListener('mouseleave', ()=>railTip.classList.remove('show'));
});

/* ============================================================
   TOPBAR: UNDO/REDO, DEVICE SWITCH, SHARE, PUBLISH
   ============================================================ */
document.getElementById('undoBtn').addEventListener('click', undo);
document.getElementById('redoBtn').addEventListener('click', redo);

document.getElementById('deviceSwitch').addEventListener('click', (e)=>{
  const btn = e.target.closest('button'); if(!btn) return;
  currentDevice = btn.dataset.device;
  document.querySelectorAll('#deviceSwitch button').forEach(b=>b.classList.toggle('active', b===btn));
  document.getElementById('canvasWrap').dataset.device = currentDevice;
  document.getElementById('deviceFrame').dataset.device = currentDevice;
  clearSelection();
});

document.getElementById('shareTopBtn').addEventListener('click', ()=>openShareModal());
document.getElementById('publishTopBtn').addEventListener('click', ()=>openPublishModal());

<script>
'use strict';
/* ============================================================
   PUBLISH MODAL (4-step wizard)
   ============================================================ */
let pubState = {step:1, connected:false, domain:'', publishMode:'live', reviewed:false};
function openPublishModal(){
  pubState = {step:1, connected:false, domain:'', publishMode:'live', reviewed:false};
  renderPublishModal();
  openModal('publishModal');
}
function pubStepperHTML(){
  const steps=['Connect','Review','Confirm','Success'];
  return `<div class="pub-stepper">${steps.map((s,i)=>{
    const n=i+1; const cls = n<pubState.step?'done':n===pubState.step?'active':'';
    return `<div class="pub-step ${cls}"><span class="c">${n<pubState.step?'✓':n}</span><span class="lb">${s}</span></div>${i<3?'<span class="ln"></span>':''}`;
  }).join('')}</div>`;
}
function renderPublishModal(){
  const inner = document.getElementById('publishModalInner');
  let body='', foot='', title='Publish to Shopify', sub='';
  if(pubState.step===1){
    title='Connect Your Store'; sub='Link your Shopify store to publish this theme';
    body = `<div class="pub-panel">
      <div class="field"><label>Shopify store domain</label><input type="text" id="shopDomain" placeholder="your-store.myshopify.com" value="${pubState.domain}"></div>
      <button class="btn btn-primary btn-block" id="connectBtn" style="margin-top:6px">
        <svg viewBox="0 0 24 24" fill="currentColor" style="width:15px;height:15px"><path d="M12 2l9 4v6c0 5-3.6 9-9 10-5.4-1-9-5-9-10V6l9-4z"/></svg>
        Connect with Shopify</button>
      <div id="connStatus" style="margin-top:14px"></div>
    </div>`;
    foot = `<button class="btn btn-ghost" data-close="publishModal">Cancel</button><button class="btn btn-primary" id="pubNext" disabled>Continue</button>`;
  } else if(pubState.step===2){
    title='Review Changes'; sub='Here’s what will go live';
    const changed = changeLog.slice(0, Math.min(6, changeLog.length));
    body = `<div class="pub-panel"><div class="publish-checklist">
      ${changed.map(c=>`<div class="pcheck-item">${ICONS.check}${c.label}</div>`).join('')}
      <div class="pcheck-item">${ICONS.check}${storeState.sections.length} sections ready to publish</div>
    </div></div>`;
    foot = `<button class="btn btn-ghost" id="pubBack">Back</button><button class="btn btn-primary" id="pubNext">Continue</button>`;
  } else if(pubState.step===3){
    title='Confirm & Publish'; sub='Choose how this theme goes live';
    body = `<div class="pub-panel" style="display:flex;flex-direction:column;gap:10px">
      <div class="radio-card ${pubState.publishMode==='draft'?'active':''}" data-mode="draft"><div class="dot"></div><div><div class="rt">Publish as draft theme</div><div class="rd">Preview on Shopify without replacing your live theme</div></div></div>
      <div class="radio-card ${pubState.publishMode==='live'?'active':''}" data-mode="live"><div class="dot"></div><div><div class="rt">Publish live now</div><div class="rd">Immediately replaces your current live theme</div></div></div>
      <div class="warn-callout" style="display:${pubState.publishMode==='live'?'flex':'none'}" id="liveWarn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>This will replace your current live theme immediately for all customers.</div>
      <label style="display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;margin-top:4px;cursor:pointer"><input type="checkbox" id="reviewedCheck" ${pubState.reviewed?'checked':''} style="width:16px;height:16px;accent-color:var(--accent)"> I’ve reviewed the changes above</label>
    </div>`;
    foot = `<button class="btn btn-ghost" id="pubBack">Back</button><button class="btn btn-accent" id="pubNext" ${pubState.reviewed?'':'disabled'}>Confirm & Publish</button>`;
  } else if(pubState.step===4){
    title=''; sub='';
    body = `<div class="pub-panel" id="publishingBody" style="text-align:center;padding:20px 0">
      <div class="progress-steps" id="publishSteps" style="align-items:flex-start;max-width:280px;margin:0 auto;text-align:left">
        ${['Uploading assets','Compiling theme','Running checks','Going live'].map((s,i)=>`<div class="pstep" data-pstep="${i}"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"/></svg></span>${s}</div>`).join('')}
      </div>
    </div>`;
    foot='';
  }
  inner.innerHTML = `
    <div class="modal-head">${pubState.step<4?`<div><div class="tt">${title}</div><div class="st">${sub}</div></div><button class="modal-close" data-close="publishModal">${ICONS.x}</button>`:''}</div>
    <div class="modal-body"><div style="padding:0 2px 4px">${pubStepperHTML()}</div>${body}</div>
    <div class="modal-foot" style="display:${foot?'flex':'none'}">${foot}</div>`;
  bindModalClose(inner);

  if(pubState.step===1){
    document.getElementById('shopDomain').oninput = (e)=>{ pubState.domain = e.target.value; };
    document.getElementById('connectBtn').onclick = ()=>{
      if(!pubState.domain.trim()){ toast('Enter your store domain'); return; }
      document.getElementById('connStatus').innerHTML = `<div class="ai-loading"><span class="spinner"></span>Connecting to Shopify…</div>`;
      setTimeout(()=>{
        pubState.connected = true;
        document.getElementById('connStatus').innerHTML = `<div class="pcheck-item">${ICONS.check}Connected to <b style="margin-left:3px">${pubState.domain||'jenni-travel.myshopify.com'}</b></div>`;
        document.getElementById('pubNext').disabled = false;
      }, 1100);
    };
  }
  if(pubState.step===3){
    inner.querySelectorAll('.radio-card').forEach(rc=>rc.onclick=()=>{
      pubState.publishMode = rc.dataset.mode;
      inner.querySelectorAll('.radio-card').forEach(x=>x.classList.remove('active')); rc.classList.add('active');
      document.getElementById('liveWarn').style.display = pubState.publishMode==='live'?'flex':'none';
    });
    document.getElementById('reviewedCheck').onchange = (e)=>{ pubState.reviewed = e.target.checked; document.getElementById('pubNext').disabled = !e.target.checked; };
  }
  const backBtn = document.getElementById('pubBack'); if(backBtn) backBtn.onclick = ()=>{ pubState.step--; renderPublishModal(); };
  const nextBtn = document.getElementById('pubNext');
  if(nextBtn) nextBtn.onclick = ()=>{
    if(pubState.step===3){ runPublishAnimation(); }
    pubState.step++; renderPublishModal();
  };
  if(pubState.step===4){
    setTimeout(runPublishSteps, 200);
  }
}
function runPublishAnimation(){}
function runPublishSteps(){
  const steps = document.querySelectorAll('#publishSteps .pstep');
  let i=0;
  const next=()=>{
    if(i>0) steps[i-1].classList.add('done');
    if(i>=steps.length){ finishPublish(); return; }
    steps[i].classList.add('active');
    i++;
    setTimeout(next, 750);
  };
  next();
}
function finishPublish(){
  const inner = document.getElementById('publishModalInner');
  inner.innerHTML = `
    <div class="modal-body" style="text-align:center;padding-top:36px">
      <div class="success-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:34px;height:34px"><path d="M4 12l6 6L20 6"/></svg></div>
      <div style="font-weight:800;font-size:18px;margin-bottom:6px">Your store is live 🎉</div>
      <div style="font-size:13px;color:var(--ink-2);max-width:320px;margin:0 auto 26px">Jenni Travel Co. has been published to ${pubState.domain||'jenni-travel.myshopify.com'}</div>
    </div>
    <div class="modal-foot" style="justify-content:center">
      <button class="btn btn-ghost" data-close="publishModal">Back to Editor</button>
      <button class="btn btn-primary" id="viewLiveBtn">View Store</button>
    </div>`;
  bindModalClose(inner);
  document.getElementById('viewLiveBtn').onclick = ()=>{ toast('Opening live store…'); };
  commitChange('Published to Shopify', 'publish');
  document.getElementById('saveStatusText').textContent='Published';
}
</script>
<script>
'use strict';
/* ============================================================
   VIEW: PRODUCT ANALYSIS

function renderAnalyzeView(){
  document.getElementById('view-analyze').innerHTML = `
    <div class="pv-wrap">

        </div>
        <div id="analyzeResults"></div>
      </div>
    </div>`;
  document.getElementById('analyzeBtn').onclick = runAnalysis;
}
function runAnalysis(){
  const box = document.getElementById('analyzeResults');
  const steps = ['Fetching product page','Extracting product data','Analyzing images & copy','Scoring against 40+ signals'];
  box.innerHTML = `<div class="progress-steps" id="anSteps">${steps.map((s,i)=>`<div class="pstep" data-i="${i}"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"/></svg></span>${s}</div>`).join('')}</div>`;
  const psteps = document.querySelectorAll('#anSteps .pstep');
  let i=0;
  const tick=()=>{
    if(i>0) psteps[i-1].classList.add('done');
    if(i>=psteps.length){ showAnalysisResult(); return; }
    psteps[i].classList.add('active'); i++;
    setTimeout(tick, 600);
  };
  tick();
}
function showAnalysisResult(){
  const box = document.getElementById('analyzeResults');
  const metrics = [
    {l:'Title clarity', v:88}, {l:'Image quality', v:92}, {l:'Price positioning', v:74},
    {l:'Trust signals', v:80}, {l:'Description depth', v:64}
  ];
  const score = Math.round(metrics.reduce((a,m)=>a+m.v,0)/metrics.length);
  const circ = 2*Math.PI*54;
  box.innerHTML = `
    <div style="margin-top:26px;padding-top:26px;border-top:1px solid var(--app-border)">
      <div class="score-ring-wrap">
        <div class="score-ring">
          <svg width="150" height="150" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="54" fill="none" stroke="var(--app-surface-2)" stroke-width="10"/>
            <circle cx="60" cy="60" r="54" fill="none" stroke="var(--viz-1)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-score/100)}"/>
          </svg>
          <div class="num"><b>${score}</b><span>Product Score</span></div>
        </div>
        <div class="score-bars">
          ${metrics.map(m=>`<div class="sbar-row"><span class="l">${m.l}</span><div class="sbar-track"><div class="sbar-fill" style="width:${m.v}%"></div></div><span class="v">${m.v}</span></div>`).join('')}
        </div>
      </div>
      <div class="suggest-list">
        <div class="suggest-item">${warnIcon()}<div><div class="t">Description reads generic</div><div class="d">Add material sourcing and lifetime-warranty details — buyers of premium goods convert 2.1x more on specificity.</div></div></div>
        <div class="suggest-item">${warnIcon()}<div><div class="t">Price lacks anchoring</div><div class="d">Show a comparison to full-price competitors or a "value of included features" breakdown near the price.</div></div></div>
        <div class="suggest-item">${warnIcon()}<div><div class="t">No urgency signal</div><div class="d">Consider a low-stock indicator or limited-time offer on the product page.</div></div></div>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:22px" id="toPersonaBtn">Continue to Persona & Marketing Angle →</button>
    </div>`;
  document.getElementById('toPersonaBtn').onclick = ()=>goToView('persona');
}
function warnIcon(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>`; }
VIEW_INIT.analyze = renderAnalyzeView;
</script>

VIEW_INIT.images = renderImagesView;

function openLibraryGenModal(){
  const inner = document.getElementById('imageGenModalInner');
  inner.innerHTML = `
    <div class="modal-head"><div><div class="tt">Generate Image with AI</div><div class="st">New images are added straight to your library</div></div><button class="modal-close" data-close="imageGenModal">${ICONS.x}</button></div>
    <div class="modal-body">
      <div class="lib-ai-row" style="margin-bottom:16px"><textarea id="libGenPrompt" placeholder="e.g. Full-grain leather bag resting on a train station bench" style="background:var(--app-surface-2);color:var(--ink)"></textarea><button id="libGenGo" class="btn btn-accent">Generate</button></div>
      <div class="imggen-grid" id="libGenResults"></div>
    </div>`;
  bindModalClose(inner);
  document.getElementById('libGenGo').onclick = ()=>{
    const grid = document.getElementById('libGenResults');
    grid.innerHTML = Array(4).fill('<div class="imggen-skel"></div>').join('');
    setTimeout(()=>{
      const picks = shuffle(ALL_IMGS.slice()).slice(0,4);
      grid.innerHTML = picks.map(id=>`<div class="imggen-item" data-id="${id}"><img src="${IMG(id,300,400)}"><span class="use-btn">Add to Library</span></div>`).join('');
      grid.querySelectorAll('.imggen-item').forEach(it=>it.onclick=()=>{
        LIB_IMAGES.unshift({id:it.dataset.id+'-'+Date.now(), src:IMG(it.dataset.id,500,500), tag:'AI Generated'});
        closeModal('imageGenModal');
        renderImagesView();
        toast('Image added to library');
      });
    }, 1300);
  };
  openModal('imageGenModal');
}
</script>
<script>
'use strict';

function renderHistoryView(){
  const view = document.getElementById('view-history');
  if(!view.querySelector('.pv-wrap')){
    view.innerHTML = `<div class="pv-wrap"><div class="pv-head"><h1>History</h1><p>Every change is saved automatically. Restore any previous version instantly.</p></div>
      <div class="card card-pad"><div class="hist-list" id="histList"></div></div></div>`;
  }
  const list = document.getElementById('histList');
  list.innerHTML = changeLog.map((h,i)=>{
    const ic = HIST_ICON[h.icon]||HIST_ICON.edit;
    return `<div class="hist-item">
      <div class="hist-ic" style="background:${ic.bg};color:${ic.color}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic.svg}</svg></div>
      <div class="hist-body"><div class="t">${h.label}</div><div class="t2">${h.time}</div></div>
      ${i===changeLog.length-1 ? `<button class="btn btn-soft btn-sm" data-restore-initial="1">Restore</button>` : `<button class="btn btn-ghost btn-sm" data-idx="${i}" disabled title="Demo: only the original version is restorable">Restore</button>`}
    </div>`;
  }).join('');
  const initBtn = list.querySelector('[data-restore-initial]');
  if(initBtn) initBtn.onclick = ()=>{
    showConfirm({title:'Restore original AI-generated version?', body:'This will revert all edits back to the very first generated store. You can undo this afterward.', confirmLabel:'Restore', danger:false,
      onConfirm:()=>{ applySnapshot(INITIAL_SNAPSHOT); commitChange('Restored original version','save'); goToView('editor'); toast('Restored to original version'); }});
  };
}
VIEW_INIT.history = renderHistoryView;
</script>
<script>
'use strict';
/* ============================================================
   VIEW: ANALYTICS
   ============================================================ */
function sparkPath(vals, w, h){
  const min=Math.min(...vals), max=Math.max(...vals);
  const pts = vals.map((v,i)=>[ i/(vals.length-1)*w, h - (max===min?h/2:(v-min)/(max-min)*h) ]);
  return pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
}
function renderSpark(vals, color){
  const w=100,h=30;
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${sparkPath(vals,w,h)}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
const REVENUE_30D = [820,910,860,1040,980,1120,1300,1180,1240,1360,1290,1410,1500,1380,1460,1600,1550,1690,1720,1650,1780,1840,1760,1900,1980,1870,2040,2120,2010,2180];

function renderAnalyticsView(){
  const days = REVENUE_30D.length;
  document.getElementById('view-analytics').innerHTML = `
    <div class="pv-wrap">
      <div class="pv-head"><h1>Analytics</h1><p>How Jenni Travel Co. is performing since launch.</p></div>
      <div class="stat-grid">
        <div class="card stat-tile"><div class="lbl">Sessions</div><div class="val">12,480</div><div class="delta good"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 15l-6-6-6 6"/></svg>8.2%</div>${renderSpark([40,44,42,50,48,55,60,58,62,68,66,72],'var(--viz-1)')}</div>
        <div class="card stat-tile"><div class="lbl">Conversion Rate</div><div class="val">3.4%</div><div class="delta good"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 15l-6-6-6 6"/></svg>0.6pt</div>${renderSpark([2.6,2.7,2.9,2.8,3.0,3.1,3.0,3.2,3.3,3.2,3.4,3.4],'var(--viz-1)')}</div>
        <div class="card stat-tile"><div class="lbl">Average Order Value</div><div class="val">$94</div><div class="delta bad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>2.1%</div>${renderSpark([98,97,99,95,96,94,95,93,94,95,93,94],'var(--viz-2)')}</div>
        <div class="card stat-tile"><div class="lbl">Revenue</div><div class="val">$18,240</div><div class="delta good"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 15l-6-6-6 6"/></svg>14%</div>${renderSpark([12,13,12.5,14,13.8,15,16,15.5,16.8,17.5,17.2,18.2],'var(--viz-1)')}</div>
      </div>
      <div class="card chart-card">
        <div class="ch-head"><h3>Revenue — Last 30 Days</h3><div class="chart-legend"><span><i style="background:var(--viz-1)"></i>Revenue</span></div></div>
        <div style="position:relative" id="revChartWrap"></div>
      </div>
      <div class="two-col-charts">
        <div class="card chart-card">
          <div class="ch-head"><h3>Engagement by Section</h3></div>
          <div id="engChart"></div>
        </div>
        <div class="card chart-card">
          <div class="ch-head"><h3>Traffic Sources</h3></div>
          <div class="donut-wrap" id="donutChart"></div>
        </div>
      </div>
    </div>`;
  renderRevenueChart();
  renderEngagementChart();
  renderDonutChart();
}

function renderRevenueChart(){
  const wrap = document.getElementById('revChartWrap');
  const w=880,h=220,pad=28;
  const vals = REVENUE_30D;
  const max = Math.max(...vals), min = Math.min(...vals)*0.9;
  const x = i=> pad + i/(vals.length-1)*(w-pad*2);
  const y = v=> h-pad - (v-min)/(max-min)*(h-pad*1.4);
  const linePath = vals.map((v,i)=>(i===0?'M':'L')+x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
  const areaPath = linePath + ` L${x(vals.length-1).toFixed(1)},${h-pad} L${x(0).toFixed(1)},${h-pad} Z`;
  const gridLines = [0,1,2,3].map(i=>{ const gy = pad + i*(h-pad*1.4)/3; return `<line x1="${pad}" y1="${gy.toFixed(1)}" x2="${w-pad}" y2="${gy.toFixed(1)}" stroke="var(--viz-grid)" stroke-width="1"/>`; }).join('');
  wrap.innerHTML = `
    <svg width="100%" viewBox="0 0 ${w} ${h}" id="revSvg" style="overflow:visible">
      <defs><linearGradient id="revGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--viz-1)" stop-opacity="0.18"/><stop offset="100%" stop-color="var(--viz-1)" stop-opacity="0"/></linearGradient></defs>
      ${gridLines}
      <path d="${areaPath}" fill="url(#revGrad)"/>
      <path d="${linePath}" fill="none" stroke="var(--viz-1)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
      <line id="revCross" x1="0" y1="${pad}" x2="0" y2="${h-pad}" stroke="var(--viz-baseline)" stroke-width="1" style="opacity:0"/>
      <circle id="revDot" r="4.5" fill="var(--viz-1)" stroke="#fff" stroke-width="2" style="opacity:0"/>
      <rect id="revHit" x="0" y="0" width="${w}" height="${h}" fill="transparent"/>
    </svg>
    <div class="tooltip-box" id="revTip"></div>`;
  const svg = document.getElementById('revSvg');
  const hit = document.getElementById('revHit');
  const tip = document.getElementById('revTip');
  const cross = document.getElementById('revCross');
  const dot = document.getElementById('revDot');
  hit.addEventListener('mousemove', (e)=>{
    const r = svg.getBoundingClientRect();
    const relX = (e.clientX - r.left) / r.width * w;
    let idx = Math.round((relX-pad)/(w-pad*2)*(vals.length-1));
    idx = Math.max(0, Math.min(vals.length-1, idx));
    const px = x(idx), py = y(vals[idx]);
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.style.opacity='1';
    dot.setAttribute('cx', px); dot.setAttribute('cy', py); dot.style.opacity='1';
    tip.style.opacity='1';
    tip.style.left = (px/w*100)+'%'; tip.style.top = (py-38)+'px'; tip.style.transform='translateX(-50%)';
    tip.textContent = `Day ${idx+1} · $${vals[idx].toLocaleString()}`;
  });
  hit.addEventListener('mouseleave', ()=>{ cross.style.opacity='0'; dot.style.opacity='0'; tip.style.opacity='0'; });
}

function renderEngagementChart(){
  const data = [{l:'Hero',v:92},{l:'Features',v:78},{l:'Reviews',v:71},{l:'FAQ',v:54},{l:'Newsletter',v:38}];
  document.getElementById('engChart').innerHTML = data.map(d=>`<div class="hbar-row"><span class="l">${d.l}</span><div class="hbar-track"><div class="hbar-fill" style="width:${d.v}%"></div></div><span class="v">${d.v}%</span></div>`).join('');
}

function renderDonutChart(){
  const data = [{l:'Organic Search',v:38,c:'var(--viz-1)'},{l:'Paid Social',v:26,c:'var(--viz-2)'},{l:'Direct',v:18,c:'var(--viz-3)'},{l:'Email',v:12,c:'var(--viz-4)'},{l:'Referral',v:6,c:'var(--viz-5)'}];
  const r=52, cx=60, cy=60, circ=2*Math.PI*r;
  let offset=0;
  const arcs = data.map(d=>{
    const len = d.v/100*circ;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.c}" stroke-width="16" stroke-dasharray="${len-2} ${circ-len+2}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += len;
    return seg;
  }).join('');
  document.getElementById('donutChart').innerHTML = `
    <svg width="120" height="120" viewBox="0 0 120 120">${arcs}</svg>
    <div class="donut-legend">${data.map(d=>`<div class="r"><i style="background:${d.c}"></i>${d.l}<span class="lv">${d.v}%</span></div>`).join('')}</div>`;
}
VIEW_INIT.analytics = renderAnalyticsView;
</script>
