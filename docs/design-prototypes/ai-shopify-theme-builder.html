<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jenni Theme Builder — AI Shopify Theme Editor Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Playfair+Display:wght@500;700&family=Poppins:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ RESET ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--app-bg);-webkit-font-smoothing:antialiased;overflow:hidden}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
ul{list-style:none}
svg{display:block}
::selection{background:rgba(91,79,233,.25)}

/* ============ APP CHROME TOKENS ============ */
:root{
  --app-bg:#f4f3ef;
  --app-surface:#ffffff;
  --app-surface-2:#faf9f6;
  --app-border:rgba(20,20,18,.09);
  --app-border-strong:rgba(20,20,18,.15);
  --ink:#15140f;
  --ink-2:#6b695f;
  --ink-3:#9a988c;
  --accent:#5b4fe9;
  --accent-ink:#ffffff;
  --accent-soft:#efecfd;
  --accent-soft-2:#e2ddfb;
  --danger:#d03b3b;
  --danger-soft:#fbeceb;
  --success:#0ca30c;
  --success-soft:#e9f8e9;
  --warning:#c98500;
  --warning-soft:#fdf3e0;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:20px;
  --radius-xl:28px;
  --shadow-xs:0 1px 2px rgba(20,20,18,.05);
  --shadow-sm:0 2px 8px rgba(20,20,18,.07);
  --shadow-md:0 12px 32px -12px rgba(20,20,18,.22);
  --shadow-lg:0 30px 70px -20px rgba(20,20,18,.32);
  --ease:cubic-bezier(.2,.7,.3,1);
  /* dataviz roles (light) */
  --viz-surface:#fcfcfb;
  --viz-ink:#0b0b0b;
  --viz-ink-2:#52514e;
  --viz-muted:#898781;
  --viz-grid:#e1e0d9;
  --viz-baseline:#c3c2b7;
  --viz-1:#2a78d6;
  --viz-2:#eb6834;
  --viz-3:#1baf7a;
  --viz-4:#eda100;
  --viz-5:#e87ba4;
  --viz-good:#0ca30c;
}

/* ============ STOREFRONT (EDITABLE DESIGN) TOKENS ============ */
#storefront{
  --s-primary:#c1502e;
  --s-primary-ink:#ffffff;
  --s-secondary:#21201b;
  --s-ink:#211f1a;
  --s-ink-2:#6b6558;
  --s-bg:#faf7f2;
  --s-surface:#ffffff;
  --s-border:rgba(33,31,26,.1);
  --s-radius:10px;
  --s-btn-radius:8px;
  --s-img-radius:14px;
  --s-shadow:0 1px 3px rgba(33,31,26,.08);
  --s-heading-font:'Fraunces',serif;
  --s-body-font:'Inter',sans-serif;
  --s-heading-weight:600;
  --s-space:1;
  --s-base-size:16px;
}

/* ============ SHELL LAYOUT ============ */
#appShell{height:100vh;display:flex;background:var(--app-bg)}

/* left icon rail */
.rail{width:68px;flex:none;background:var(--app-surface);border-right:1px solid var(--app-border);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px;z-index:40}
.rail-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#5b4fe9,#8f7bff);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.rail-group{display:flex;flex-direction:column;gap:2px;width:100%;align-items:center}
.rail-spacer{flex:1}
.rail-btn{width:48px;height:48px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);transition:background .15s var(--ease),color .15s var(--ease);position:relative}
.rail-btn svg{width:19px;height:19px}
.rail-btn span{font-size:9.5px;font-weight:600;letter-spacing:.01em}
.rail-btn:hover{background:var(--app-surface-2);color:var(--ink)}
.rail-btn.active{background:var(--accent-soft);color:var(--accent)}
.rail-btn.active::before{content:'';position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:3px;background:var(--accent)}
.rail-tip{position:fixed;left:74px;background:#15140f;color:#fff;font-size:12px;font-weight:500;padding:6px 10px;border-radius:7px;white-space:nowrap;pointer-events:none;opacity:0;transform:translateX(-4px);transition:opacity .12s,transform .12s;z-index:200}
.rail-tip.show{opacity:1;transform:translateX(0)}

/* main column */
.main-col{flex:1;display:flex;flex-direction:column;min-width:0}

/* topbar */
.topbar{height:60px;flex:none;background:var(--app-surface);border-bottom:1px solid var(--app-border);display:flex;align-items:center;padding:0 18px;gap:16px;z-index:30}
.tb-group{display:flex;align-items:center;gap:6px}
.tb-divider{width:1px;height:24px;background:var(--app-border);margin:0 6px}
.proj-name{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px}
.proj-name .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.icon-btn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);transition:background .15s,color .15s}
.icon-btn svg{width:17px;height:17px}
.icon-btn:hover:not(:disabled){background:var(--app-surface-2);color:var(--ink)}
.icon-btn:disabled{opacity:.32;cursor:default}
.device-switch{display:flex;background:var(--app-surface-2);border-radius:10px;padding:3px;gap:2px}
.device-switch button{width:32px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.device-switch button svg{width:15px;height:15px}
.device-switch button.active{background:#fff;color:var(--ink);box-shadow:var(--shadow-xs)}
.save-status{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.save-status .pulse{width:7px;height:7px;border-radius:50%;background:var(--success);position:relative}
.save-status .pulse.saving{background:var(--warning);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:9px;font-size:13.5px;font-weight:600;transition:all .15s var(--ease);white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:#000}
.btn-accent{background:var(--accent);color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.05), 0 6px 16px -6px rgba(91,79,233,.55)}
.btn-accent:hover{background:#4d41d6}
.btn-ghost{background:transparent;color:var(--ink-2);border:1px solid var(--app-border-strong)}
.btn-ghost:hover{background:var(--app-surface-2);color:var(--ink)}
.btn-soft{background:var(--app-surface-2);color:var(--ink)}
.btn-soft:hover{background:#eeece6}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-danger:hover{background:#f7dcda}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}
.btn-block{width:100%;justify-content:center}

/* view container */
.view-container{flex:1;min-height:0;position:relative;background:var(--app-bg)}
.view{position:absolute;inset:0;display:none;overflow:auto}
.view.active{display:block}

/* ============ EDITOR VIEW ============ */
.editor-shell{position:absolute;inset:0;display:flex}
.canvas-wrap{flex:1;overflow:auto;padding:36px 36px 120px;display:flex;justify-content:center;scroll-behavior:smooth}
.device-frame{width:100%;max-width:1180px;background:var(--s-bg,#faf7f2);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;transition:max-width .35s var(--ease),border-radius .35s var(--ease);position:relative}
.device-frame[data-device="tablet"]{max-width:768px}
.device-frame[data-device="mobile"]{max-width:390px}
.canvas-wrap[data-device="tablet"],.canvas-wrap[data-device="mobile"]{padding-top:52px}
.device-chrome{display:none;position:absolute;top:-40px;left:0;right:0;height:32px;align-items:center;justify-content:center;gap:6px;color:var(--ink-3)}
.canvas-wrap[data-device="tablet"] .device-chrome,.canvas-wrap[data-device="mobile"] .device-chrome{display:flex}
.device-chrome .notch{width:60px;height:6px;border-radius:4px;background:var(--app-border-strong)}

/* right contextual panel */
.side-panel{width:0;flex:none;background:var(--app-surface);border-left:1px solid var(--app-border);overflow:hidden;transition:width .28s var(--ease);display:flex;flex-direction:column}
.side-panel.open{width:328px}
.sp-head{padding:16px 18px;border-bottom:1px solid var(--app-border);display:flex;align-items:center;gap:10px;flex:none}
.sp-head .sp-icon{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.sp-head .sp-icon svg{width:15px;height:15px}
.sp-head-text{flex:1;min-width:0}
.sp-head-text .t{font-weight:700;font-size:13.5px}
.sp-head-text .s{font-size:11.5px;color:var(--ink-3)}
.sp-body{flex:1;overflow-y:auto;padding:16px 18px 30px;display:flex;flex-direction:column;gap:20px}
.sp-section{display:flex;flex-direction:column;gap:10px}
.sp-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.field input[type=text],.field input[type=url],.field input[type=email],.field input[type=password],.field textarea,.field select{width:100%;border:1px solid var(--app-border-strong);background:var(--app-surface-2);border-radius:8px;padding:8px 10px;font-size:13px;transition:border-color .15s}
.field textarea{resize:vertical;min-height:64px;font-family:inherit}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);background:#fff}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatch-row{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:8px;border:1px solid var(--app-border-strong);cursor:pointer;position:relative;flex:none}
.swatch.active::after{content:'';position:absolute;inset:-4px;border:2px solid var(--accent);border-radius:11px}
.color-input-wrap{display:flex;align-items:center;gap:8px}
.color-input-wrap input[type=color]{width:34px;height:34px;border:1px solid var(--app-border-strong);border-radius:8px;padding:2px;background:#fff}
.color-input-wrap .hex{font-size:12px;color:var(--ink-2);font-family:ui-monospace,monospace}
.seg{display:flex;background:var(--app-surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{flex:1;padding:6px 8px;border-radius:6px;font-size:12px;font-weight:600;color:var(--ink-2)}
.seg button.active{background:#fff;color:var(--ink);box-shadow:var(--shadow-xs)}
.slider-row{display:flex;flex-direction:column;gap:6px}
.slider-row .top{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent);height:4px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.toggle-row .tt{font-size:12.5px;font-weight:600}
.toggle-row .ts{font-size:11px;color:var(--ink-3)}
.switch{width:36px;height:21px;border-radius:20px;background:var(--app-border-strong);position:relative;flex:none;transition:background .15s}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:var(--shadow-xs);transition:transform .15s var(--ease)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(15px)}
.accordion-item{border:1px solid var(--app-border);border-radius:10px;overflow:hidden}
.accordion-head{padding:12px 14px;display:flex;align-items:center;justify-content:between;gap:8px;cursor:pointer;font-size:13px;font-weight:700}
.accordion-head svg{width:14px;height:14px;margin-left:auto;transition:transform .2s}
.accordion-item.open .accordion-head svg{transform:rotate(180deg)}
.accordion-body{max-height:0;overflow:hidden;transition:max-height .25s var(--ease)}
.accordion-item.open .accordion-body{max-height:600px}
.accordion-body-in{padding:0 14px 16px;display:flex;flex-direction:column;gap:14px}

/* ============ STOREFRONT RENDER ============ */
#storefront{font-family:var(--s-body-font);color:var(--s-ink);background:var(--s-bg);font-size:var(--s-base-size)}
#storefront img{border-radius:var(--s-img-radius)}
.sf-section{position:relative;transition:outline-color .15s}
.sf-section:hover{outline:1.5px dashed rgba(91,79,233,.4);outline-offset:-1.5px}
.sf-section.is-selected{outline:1.5px solid var(--accent);outline-offset:-1.5px}
.sf-section.flash{animation:flash 1s var(--ease)}
@keyframes flash{0%{background:rgba(91,79,233,.12)}100%{background:transparent}}
.sf-label{position:absolute;top:-1px;left:-1px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:0 0 8px 0;opacity:0;transform:translateY(-4px);transition:opacity .15s,transform .15s;z-index:15;pointer-events:none;letter-spacing:.02em}
.sf-section:hover .sf-label,.sf-section.is-selected .sf-label{opacity:1;transform:translateY(0)}
.sec-ctrls{position:absolute;top:8px;right:8px;display:flex;gap:2px;background:#15140f;padding:3px;border-radius:9px;box-shadow:var(--shadow-md);opacity:0;transform:translateY(-4px);transition:opacity .15s,transform .15s;z-index:20}
.sf-section.is-selected .sec-ctrls{opacity:1;transform:translateY(0);pointer-events:auto}
.sec-ctrls button{width:28px;height:28px;border-radius:6px;color:#cfceea;display:flex;align-items:center;justify-content:center}
.sec-ctrls button svg{width:14px;height:14px}
.sec-ctrls button:hover{background:rgba(255,255,255,.14);color:#fff}
.sec-ctrls button.danger:hover{background:rgba(208,59,59,.35);color:#ff9d9d}
.sec-ctrls .sep{width:1px;background:rgba(255,255,255,.16);margin:4px 2px}

[data-editable]{outline-offset:2px;border-radius:4px;cursor:text;transition:outline-color .12s}
[data-editable]:hover{outline:1.5px dashed rgba(91,79,233,.55)}
[data-editable].is-selected{outline:1.5px solid var(--accent)}
[data-editable][contenteditable="true"]{outline:1.5px solid var(--accent);background:rgba(91,79,233,.05)}
[data-image]{cursor:pointer;position:relative}
[data-image]:hover::after{content:'';position:absolute;inset:0;background:rgba(21,20,15,.15);border-radius:inherit}
[data-image].is-selected::after{content:'';position:absolute;inset:0;outline:2px solid var(--accent);outline-offset:-2px;border-radius:inherit}
[data-image] .img-hint{position:absolute;bottom:10px;left:50%;transform:translate(-50%,6px);background:#fff;color:var(--ink);font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:20px;box-shadow:var(--shadow-md);opacity:0;transition:opacity .15s,transform .15s;display:flex;align-items:center;gap:5px;white-space:nowrap}
[data-image] .img-hint svg{width:12px;height:12px}
[data-image]:hover .img-hint{opacity:1;transform:translate(-50%,0)}

/* add-zone between sections */
.add-zone{height:10px;position:relative;display:flex;align-items:center;justify-content:center;z-index:18;transition:height .18s var(--ease)}
.add-zone:hover{height:38px}
.add-zone::before{content:'';position:absolute;left:24px;right:24px;top:50%;height:1px;background:var(--app-border-strong);opacity:0;transition:opacity .18s}
.add-zone:hover::before{opacity:1}
.add-zone-btn{opacity:0;transform:scale(.85);transition:opacity .15s,transform .15s;display:flex;align-items:center;gap:6px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:6px 13px;border-radius:20px;box-shadow:var(--shadow-md);position:relative;z-index:2}
.add-zone-btn svg{width:13px;height:13px}
.add-zone:hover .add-zone-btn{opacity:1;transform:scale(1)}

/* floating text toolbar */
.float-toolbar{position:fixed;display:none;align-items:center;gap:1px;background:#15140f;padding:4px;border-radius:11px;box-shadow:var(--shadow-lg);z-index:120}
.float-toolbar.show{display:flex}
.ft-btn{height:32px;padding:0 9px;border-radius:7px;color:#d8d7ee;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap}
.ft-btn svg{width:14px;height:14px}
.ft-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.ft-btn.active{background:var(--accent);color:#fff}
.ft-btn.ai{background:linear-gradient(135deg,#5b4fe9,#8f7bff);color:#fff}
.ft-btn.ai:hover{filter:brightness(1.08)}
.ft-sep{width:1px;height:20px;background:rgba(255,255,255,.15);margin:0 3px}

/* popovers (AI edit, color, image) */
.popover{position:fixed;display:none;background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);border:1px solid var(--app-border);z-index:130;overflow:hidden}
.popover.show{display:block}
.popover.w-ai{width:320px}
.pop-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--app-border)}
.pop-head .ic{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#5b4fe9,#8f7bff);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.pop-head .ic svg{width:13px;height:13px}
.pop-head .tt{font-size:12.5px;font-weight:700;flex:1}
.pop-head .close{width:22px;height:22px;border-radius:6px;color:var(--ink-3);display:flex;align-items:center;justify-content:center}
.pop-head .close:hover{background:var(--app-surface-2);color:var(--ink)}
.pop-head .close svg{width:13px;height:13px}
.pop-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.pop-body textarea{width:100%;min-height:58px;border:1px solid var(--app-border-strong);border-radius:9px;padding:9px 10px;font-size:12.5px;font-family:inherit;resize:none;background:var(--app-surface-2)}
.pop-body textarea:focus{outline:none;border-color:var(--accent);background:#fff}
.pop-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border-radius:20px;background:var(--app-surface-2);font-size:11.5px;font-weight:600;color:var(--ink-2);border:1px solid transparent}
.chip:hover{background:var(--accent-soft);color:var(--accent)}
.chip.active{background:var(--accent);color:#fff}
.ai-loading{display:flex;align-items:center;gap:9px;padding:6px 2px;font-size:12.5px;color:var(--ink-2);font-weight:600}
.spinner{width:15px;height:15px;border-radius:50%;border:2px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* color popover */
.popover.w-color{width:200px}
.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:12px}
.color-grid .sw{width:26px;height:26px;border-radius:7px;border:1px solid var(--app-border-strong);position:relative}
.color-grid .sw.active::after{content:'';position:absolute;inset:-3px;border:2px solid var(--accent);border-radius:9px}

/* image popover */
.popover.w-image{width:236px}
.img-action-list{display:flex;flex-direction:column;padding:6px}
.img-action{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:12.5px;font-weight:600;text-align:left}
.img-action:hover{background:var(--app-surface-2)}
.img-action .ic{width:28px;height:28px;border-radius:8px;background:var(--app-surface-2);display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none}
.img-action .ic svg{width:14px;height:14px}
.img-action:hover .ic{background:#fff}

/* generic modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,14,10,.5);backdrop-filter:blur(2px);z-index:150;display:none;align-items:center;justify-content:center;padding:30px}
.modal-backdrop.show{display:flex}
.modal{background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);max-width:920px;width:100%;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.modal.sm{max-width:460px}
.modal.md{max-width:600px}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--app-border);display:flex;align-items:center;gap:12px;flex:none}
.modal-head .tt{font-size:17px;font-weight:800;flex:1}
.modal-head .st{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.modal-close{width:32px;height:32px;border-radius:9px;color:var(--ink-3);display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--app-surface-2);color:var(--ink)}
.modal-close svg{width:16px;height:16px}
.modal-body{flex:1;overflow-y:auto;padding:22px 24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--app-border);display:flex;align-items:center;gap:10px;justify-content:flex-end;flex:none}

/* section library grid */
.lib-ai-card{border-radius:16px;padding:18px;background:linear-gradient(135deg,#5b4fe9,#7a6ef2);color:#fff;display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.lib-ai-card .tt{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.lib-ai-card .tt svg{width:17px;height:17px}
.lib-ai-card .st{font-size:12.5px;opacity:.85;line-height:1.5}
.lib-ai-row{display:flex;gap:8px}
.lib-ai-row textarea{flex:1;border:none;border-radius:10px;padding:10px 12px;font-size:12.5px;font-family:inherit;resize:none;min-height:40px}
.lib-ai-row textarea:focus{outline:none}
.lib-ai-row button{background:#15140f;color:#fff;border-radius:10px;padding:0 16px;font-weight:700;font-size:12.5px;flex:none}
.lib-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.lib-card{border:1px solid var(--app-border);border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
.lib-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.lib-thumb{height:82px;background:var(--app-surface-2);display:flex;align-items:center;justify-content:center;padding:12px;gap:3px}
.lib-thumb .bar{background:linear-gradient(135deg,#c9c6f5,#a79cf0);border-radius:3px}
.lib-card .lc-name{padding:9px 12px 11px;font-size:12.5px;font-weight:700}

/* image gen grid */
.imggen-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.imggen-item{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:3/4;background:var(--app-surface-2);cursor:pointer;border:2px solid transparent}
.imggen-item img{width:100%;height:100%;object-fit:cover}
.imggen-item:hover{border-color:var(--accent)}
.imggen-item .use-btn{position:absolute;bottom:8px;left:8px;right:8px;background:#fff;color:var(--ink);font-size:11px;font-weight:700;text-align:center;padding:7px 0;border-radius:8px;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.imggen-item:hover .use-btn{opacity:1;transform:translateY(0)}
.imggen-skel{aspect-ratio:3/4;border-radius:12px;background:linear-gradient(100deg,#eeece6 30%,#f7f6f2 50%,#eeece6 70%);background-size:200% 100%;animation:shimmer 1.3s infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* toasts */
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:300;align-items:center}
.toast{background:#15140f;color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:11px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;animation:toastIn .25s var(--ease)}
.toast svg{width:15px;height:15px;color:#8ce08c;flex:none}
@keyframes toastIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.toast.leave{animation:toastOut .2s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(6px) scale(.97)}}

/* ============ STOREFRONT CONTENT ============ */
.sf-btn{display:inline-flex;align-items:center;gap:8px;background:var(--s-primary);color:var(--s-primary-ink);padding:13px 26px;border-radius:var(--s-btn-radius);font-weight:700;font-size:14px;transition:filter .15s,transform .15s}
.sf-btn:hover{filter:brightness(1.08)}
.sf-btn.outline{background:transparent;color:var(--s-ink);border:1.5px solid var(--s-ink)}
.sf-btn.sm{padding:9px 18px;font-size:12.5px}
.sf-h{font-family:var(--s-heading-font);font-weight:var(--s-heading-weight);color:var(--s-ink);line-height:1.15;letter-spacing:-.01em}
.sf-p{color:var(--s-ink-2);line-height:1.65}
.sf-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--s-primary)}

/* announcement */
.sf-announce{background:var(--s-secondary);color:#fff;text-align:center;padding:9px 40px;font-size:12.5px;font-weight:600;letter-spacing:.02em}

/* header */
.sf-header{display:flex;align-items:center;padding:18px calc(40px * var(--s-space));background:var(--s-surface);border-bottom:1px solid var(--s-border)}
.sf-logo{font-family:var(--s-heading-font);font-weight:700;font-size:21px;letter-spacing:.02em}
.sf-nav{display:flex;gap:28px;margin:0 auto;font-size:13.5px;font-weight:600}
.sf-nav a{opacity:.85}
.sf-header-icons{display:flex;align-items:center;gap:18px;color:var(--s-ink)}
.sf-header-icons svg{width:18px;height:18px}
.sf-cart-badge{position:relative}
.sf-cart-badge b{position:absolute;top:-7px;right:-8px;background:var(--s-primary);color:#fff;font-size:9px;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}
@media(max-width:820px){.sf-nav{display:none}}

/* hero */
.sf-hero{display:grid;grid-template-columns:1.05fr 1fr;align-items:stretch;background:var(--s-bg)}
.sf-hero-copy{padding:calc(60px*var(--s-space)) calc(56px*var(--s-space));display:flex;flex-direction:column;justify-content:center;gap:18px}
.sf-hero-copy .sf-h{font-size:44px}
.sf-hero-copy .sf-p{font-size:16px;max-width:420px}
.sf-hero-cta{display:flex;align-items:center;gap:20px;margin-top:6px}
.sf-hero-cta .watch{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.sf-hero-cta .watch .pc{width:32px;height:32px;border-radius:50%;background:var(--s-surface);border:1px solid var(--s-border);display:flex;align-items:center;justify-content:center}
.sf-hero-cta .watch svg{width:11px;height:11px;color:var(--s-primary)}
.sf-hero-img{position:relative;overflow:hidden}
.sf-hero-img img{width:100%;height:100%;object-fit:cover;border-radius:0}
.sf-hero-price-card{position:absolute;bottom:22px;left:22px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);padding:12px 16px;border-radius:14px;box-shadow:var(--shadow-md);display:flex;align-items:center;gap:10px}
.sf-hero-price-card .p{font-family:var(--s-heading-font);font-weight:700;font-size:18px}
.sf-hero-price-card .stars{color:#f2a93b;font-size:11px}
@media(max-width:820px){.sf-hero{grid-template-columns:1fr}.sf-hero-copy{padding:40px 24px;order:2}.sf-hero-img{height:280px;order:1}.sf-hero-copy .sf-h{font-size:30px}}

/* section shell + heading */
.sf-sec-pad{padding:calc(74px*var(--s-space)) calc(48px*var(--s-space))}
.sf-sec-head{text-align:center;max-width:620px;margin:0 auto 44px}
.sf-sec-head .sf-h{font-size:32px;margin-top:8px}
.sf-sec-head .sf-p{margin-top:10px}

/* features */
.sf-feat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.sf-feat-card{background:var(--s-surface);border:1px solid var(--s-border);border-radius:var(--s-radius);padding:26px 22px;box-shadow:var(--s-shadow)}
.sf-feat-icon{width:42px;height:42px;border-radius:11px;background:color-mix(in srgb, var(--s-primary) 14%, transparent);color:var(--s-primary);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.sf-feat-icon svg{width:20px;height:20px}
.sf-feat-card .ft{font-family:var(--s-heading-font);font-weight:600;font-size:16.5px;margin-bottom:8px}
.sf-feat-card .fd{font-size:13.5px;color:var(--s-ink-2);line-height:1.6}
@media(max-width:820px){.sf-feat-grid{grid-template-columns:1fr 1fr}}

/* product card block (part of features section) */
.sf-product{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;margin-top:60px}
.sf-product-gallery{display:grid;grid-template-columns:70px 1fr;gap:12px}
.sf-product-thumbs{display:flex;flex-direction:column;gap:10px}
.sf-product-thumbs img{aspect-ratio:1;object-fit:cover;border:1.5px solid var(--s-border);cursor:pointer}
.sf-product-thumbs img.active{border-color:var(--s-primary)}
.sf-product-main img{width:100%;aspect-ratio:1;object-fit:cover}
.sf-product-info{display:flex;flex-direction:column;gap:14px}
.sf-product-info .name{font-family:var(--s-heading-font);font-size:28px;font-weight:600}
.sf-rating{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--s-ink-2)}
.sf-rating .stars{color:#f2a93b;letter-spacing:1px}
.sf-price{font-size:24px;font-weight:800;font-family:var(--s-heading-font)}
.sf-colors{display:flex;gap:8px;align-items:center}
.sf-colors .c{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--s-border);cursor:pointer}
.sf-colors .c.active{box-shadow:0 0 0 2px var(--s-primary)}
.sf-product-actions{display:flex;gap:10px;margin-top:6px}
.sf-trust{display:flex;gap:18px;margin-top:8px;font-size:11.5px;color:var(--s-ink-2)}
.sf-trust span{display:flex;align-items:center;gap:6px}
.sf-trust svg{width:14px;height:14px;color:var(--s-primary)}
@media(max-width:820px){.sf-product{grid-template-columns:1fr}}

/* benefits */
.sf-benefit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.sf-benefit-card{border-radius:var(--s-radius);overflow:hidden;background:var(--s-surface);border:1px solid var(--s-border)}
.sf-benefit-card img{width:100%;height:190px;object-fit:cover;border-radius:0}
.sf-benefit-card .bc-body{padding:20px}
.sf-benefit-card .bt{font-family:var(--s-heading-font);font-weight:600;font-size:16.5px;margin-bottom:6px}
.sf-benefit-card .bd{font-size:13px;color:var(--s-ink-2);line-height:1.6}
@media(max-width:820px){.sf-benefit-grid{grid-template-columns:1fr}}

/* reviews */
.sf-review-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.sf-review-card{background:var(--s-surface);border:1px solid var(--s-border);border-radius:var(--s-radius);padding:24px;box-shadow:var(--s-shadow)}
.sf-review-card .stars{color:#f2a93b;font-size:13px;margin-bottom:12px}
.sf-review-card .quote{font-size:14px;line-height:1.65;color:var(--s-ink);margin-bottom:18px}
.sf-review-person{display:flex;align-items:center;gap:10px}
.sf-review-person img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.sf-review-person .n{font-size:13px;font-weight:700}
.sf-review-person .r{font-size:11.5px;color:var(--s-ink-2)}
@media(max-width:820px){.sf-review-grid{grid-template-columns:1fr}}

/* faq */
.sf-faq-list{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.sf-faq-item{border:1px solid var(--s-border);border-radius:var(--s-radius);overflow:hidden;background:var(--s-surface)}
.sf-faq-q{padding:18px 20px;display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:600;font-size:14.5px}
.sf-faq-q svg{width:15px;height:15px;margin-left:auto;flex:none;transition:transform .2s;color:var(--s-primary)}
.sf-faq-item.open .sf-faq-q svg{transform:rotate(45deg)}
.sf-faq-a{max-height:0;overflow:hidden;transition:max-height .25s var(--ease)}
.sf-faq-item.open .sf-faq-a{max-height:200px}
.sf-faq-a-in{padding:0 20px 18px;font-size:13.5px;color:var(--s-ink-2);line-height:1.65}

/* newsletter */
.sf-newsletter{background:var(--s-secondary);color:#fff;text-align:center;padding:calc(70px*var(--s-space)) 30px}
.sf-newsletter .sf-h{color:#fff;font-size:30px}
.sf-newsletter .sf-p{color:rgba(255,255,255,.7);margin-top:10px}
.sf-nl-form{display:flex;gap:10px;max-width:400px;margin:26px auto 0}
.sf-nl-form input{flex:1;padding:13px 16px;border-radius:var(--s-btn-radius);border:none;font-size:13.5px}
.sf-nl-form input:focus{outline:none}
.sf-nl-form button{background:var(--s-primary);color:#fff;padding:13px 20px;border-radius:var(--s-btn-radius);font-weight:700;font-size:13.5px;white-space:nowrap}

/* footer */
.sf-footer{background:#171612;color:rgba(255,255,255,.65);padding:56px 48px 26px}
.sf-footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;max-width:1100px;margin:0 auto}
.sf-footer .flogo{font-family:var(--s-heading-font);color:#fff;font-size:20px;font-weight:700;margin-bottom:10px}
.sf-footer-grid .fcol h5{color:#fff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
.sf-footer-grid .fcol a{display:block;font-size:13px;margin-bottom:10px}
.sf-foot-bottom{max-width:1100px;margin:36px auto 0;padding-top:20px;border-top:1px solid rgba(255,255,255,.1);display:flex;justify-content:space-between;font-size:12px}
@media(max-width:820px){.sf-footer-grid{grid-template-columns:1fr 1fr}}

/* how it works */
.sf-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;position:relative}
.sf-step{text-align:center;padding:0 24px;position:relative}
.sf-step::before{content:'';position:absolute;top:26px;left:-50%;width:100%;height:1.5px;background:var(--s-border);z-index:0}
.sf-step:first-child::before{display:none}
.sf-step-num{width:52px;height:52px;border-radius:50%;background:var(--s-primary);color:#fff;font-family:var(--s-heading-font);font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;position:relative;z-index:1}
.sf-step .ft{font-family:var(--s-heading-font);font-weight:600;font-size:16.5px;margin-bottom:8px}
.sf-step .fd{font-size:13px;color:var(--s-ink-2);line-height:1.6;max-width:230px;margin:0 auto}
@media(max-width:820px){.sf-steps{grid-template-columns:1fr}.sf-step::before{display:none}}

/* comparison */
.sf-compare{max-width:640px;margin:0 auto;border:1px solid var(--s-border);border-radius:var(--s-radius);overflow:hidden;background:var(--s-surface)}
.sf-compare-row{display:grid;grid-template-columns:1.4fr 1fr 1fr;align-items:center}
.sf-compare-row.head{background:var(--s-secondary);color:#fff;font-weight:700;font-size:12.5px}
.sf-compare-row.head div{padding:14px 16px}
.sf-compare-row:not(.head){border-top:1px solid var(--s-border);font-size:13px}
.sf-compare-row:not(.head) div{padding:13px 16px;display:flex;align-items:center;justify-content:center;text-align:center}
.sf-compare-row div:first-child{justify-content:flex-start;text-align:left;font-weight:600}
.sf-compare-row svg{width:16px;height:16px}
.sf-compare-row .yes{color:var(--s-primary)}
.sf-compare-row .no{color:var(--s-ink-2);opacity:.4}

/* countdown */
.sf-countdown{background:var(--s-secondary);color:#fff;text-align:center;padding:56px 30px}
.sf-cd-timer{display:flex;justify-content:center;gap:14px;margin:22px 0 26px}
.sf-cd-timer .u{background:rgba(255,255,255,.1);border-radius:12px;padding:14px 18px;min-width:74px}
.sf-cd-timer .u .n{font-family:var(--s-heading-font);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.sf-cd-timer .u .l{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.6;margin-top:4px}

/* gallery */
.sf-gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:12px}
.sf-gallery-grid .g0{grid-column:span 2;grid-row:span 2}
.sf-gallery-grid img{width:100%;height:100%;object-fit:cover;transition:transform .3s var(--ease)}
.sf-gallery-grid a{overflow:hidden;display:block;border-radius:var(--s-img-radius);height:100%}
.sf-gallery-grid a>[data-image]{height:100%}
.sf-gallery-grid a:hover img{transform:scale(1.06)}

/* banner */
.sf-banner{position:relative;min-height:280px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.sf-banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sf-banner::before{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,9,6,.55),rgba(10,9,6,.25))}
.sf-banner-in{position:relative;z-index:2;color:#fff;display:flex;flex-direction:column;align-items:center;gap:14px}
.sf-banner-in .sf-h{color:#fff;font-size:34px}
.sf-banner-in .sf-eyebrow{color:#f0d9c9}

/* custom AI section */
.sf-custom{text-align:center;max-width:640px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:16px}
.sf-custom .sf-h{font-size:32px}

/* ============ SECONDARY VIEWS (shared) ============ */
.pv-wrap{max-width:1040px;margin:0 auto;padding:44px 40px 100px}
.pv-head{margin-bottom:32px}
.pv-head h1{font-size:25px;font-weight:800;letter-spacing:-.01em}
.pv-head p{color:var(--ink-2);font-size:13.5px;margin-top:6px;max-width:560px}
.card{background:var(--app-surface);border:1px solid var(--app-border);border-radius:16px;box-shadow:var(--shadow-xs)}
.card-pad{padding:26px}

/* Analyze view */
.analyze-input-row{display:flex;gap:10px}
.analyze-input-row input{flex:1;border:1px solid var(--app-border-strong);border-radius:10px;padding:13px 16px;font-size:14px;background:var(--app-surface-2)}
.analyze-input-row input:focus{outline:none;border-color:var(--accent);background:#fff}
.progress-steps{display:flex;flex-direction:column;gap:14px;margin-top:26px}
.pstep{display:flex;align-items:center;gap:12px;font-size:13.5px;font-weight:600;color:var(--ink-3)}
.pstep .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--app-border-strong);display:flex;align-items:center;justify-content:center;flex:none;transition:all .2s}
.pstep .dot svg{width:11px;height:11px;color:#fff;opacity:0}
.pstep.active{color:var(--ink)}
.pstep.active .dot{border-color:var(--accent);background:var(--accent-soft)}
.pstep.done .dot{border-color:var(--success);background:var(--success)}
.pstep.done .dot svg{opacity:1}
.pstep.done{color:var(--ink)}
.score-ring-wrap{display:flex;align-items:center;gap:34px;padding:8px 4px}
.score-ring{position:relative;width:150px;height:150px;flex:none}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-ring .num b{font-size:34px;font-weight:800;font-family:'Fraunces',serif}
.score-ring .num span{font-size:11px;color:var(--ink-3);font-weight:600}
.score-bars{flex:1;display:flex;flex-direction:column;gap:12px}
.sbar-row{display:flex;align-items:center;gap:12px}
.sbar-row .l{width:150px;font-size:12.5px;font-weight:600;color:var(--ink-2);flex:none}
.sbar-track{flex:1;height:7px;border-radius:6px;background:var(--app-surface-2);overflow:hidden}
.sbar-fill{height:100%;border-radius:6px;background:var(--viz-1)}
.sbar-row .v{width:32px;font-size:12px;font-weight:700;text-align:right;flex:none}
.suggest-list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.suggest-item{display:flex;gap:12px;padding:13px 14px;border-radius:11px;background:var(--app-surface-2)}
.suggest-item svg{width:16px;height:16px;color:var(--warning);flex:none;margin-top:1px}
.suggest-item .t{font-size:13px;font-weight:600}
.suggest-item .d{font-size:12px;color:var(--ink-2);margin-top:2px}

/* Persona view */
.persona-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.persona-card{padding:22px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:border-color .15s,transform .15s}
.persona-card:hover{transform:translateY(-2px)}
.persona-card.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.persona-avatar{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.persona-card .pn{font-weight:800;font-size:15px}
.persona-card .pd{font-size:12px;color:var(--ink-3)}
.persona-tags{display:flex;flex-wrap:wrap;gap:6px}
.persona-tags span{background:var(--app-surface-2);padding:4px 9px;border-radius:20px;font-size:11px;font-weight:600;color:var(--ink-2)}
.persona-angle{background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:10px 12px;font-size:12px;font-weight:600;line-height:1.5}
.angle-chip-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.angle-chip{padding:12px 16px;border-radius:12px;border:1px solid var(--app-border-strong);font-size:13px;font-weight:600;cursor:pointer}
.angle-chip:hover{border-color:var(--accent)}
.angle-chip.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* Generate progress view */
.gen-wrap{max-width:560px;margin:60px auto;text-align:center}
.gen-orb{width:84px;height:84px;border-radius:26px;background:linear-gradient(135deg,#5b4fe9,#8f7bff);margin:0 auto 26px;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 50px -14px rgba(91,79,233,.55);animation:orbPulse 2s ease-in-out infinite}
@keyframes orbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.gen-orb svg{width:38px;height:38px;color:#fff}
.gen-wrap h1{font-size:22px;font-weight:800;margin-bottom:8px}
.gen-wrap>p{color:var(--ink-2);font-size:13.5px;margin-bottom:34px}
.gen-track{height:6px;background:var(--app-surface-2);border-radius:6px;overflow:hidden;margin-bottom:30px}
.gen-fill{height:100%;background:linear-gradient(90deg,#5b4fe9,#8f7bff);border-radius:6px;width:0%;transition:width .5s var(--ease)}
.gen-list{display:flex;flex-direction:column;gap:2px;text-align:left}

/* Image library */
.img-tabs{display:flex;gap:6px;margin-bottom:20px}
.img-tabs button{padding:8px 15px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2)}
.img-tabs button.active{background:var(--ink);color:#fff}
.img-tabs button:not(.active):hover{background:var(--app-surface-2)}
.imglib-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.imglib-item{position:relative;border-radius:13px;overflow:hidden;aspect-ratio:1;background:var(--app-surface-2)}
.imglib-item img{width:100%;height:100%;object-fit:cover}
.imglib-tag{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.92);font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px}
.imglib-actions{position:absolute;inset:0;background:rgba(15,14,10,.45);display:flex;align-items:center;justify-content:center;gap:8px;opacity:0;transition:opacity .15s}
.imglib-item:hover .imglib-actions{opacity:1}
.imglib-actions button{width:32px;height:32px;border-radius:9px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center}
.imglib-actions button svg{width:14px;height:14px}

/* History */
.hist-list{display:flex;flex-direction:column}
.hist-item{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--app-border)}
.hist-item:last-child{border-bottom:none}
.hist-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.hist-ic svg{width:16px;height:16px}
.hist-body{flex:1;min-width:0}
.hist-body .t{font-weight:700;font-size:13.5px}
.hist-body .t2{font-size:12px;color:var(--ink-3);margin-top:2px}

/* Share */
.share-link-row{display:flex;gap:8px}
.share-link-row input{flex:1;border:1px solid var(--app-border-strong);border-radius:10px;padding:11px 14px;font-size:13px;background:var(--app-surface-2);font-family:ui-monospace,monospace}
.collab-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--app-border)}
.collab-row:last-child{border-bottom:none}
.collab-row img{width:32px;height:32px;border-radius:50%}
.collab-row .n{font-size:13px;font-weight:700}
.collab-row .e{font-size:11.5px;color:var(--ink-3)}
.collab-row select{margin-left:auto;border:1px solid var(--app-border-strong);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;background:var(--app-surface-2)}

/* Publish */
.pub-stepper{display:flex;align-items:center;gap:0;margin-bottom:34px;max-width:520px}
.pub-step{display:flex;align-items:center;gap:9px;flex:1}
.pub-step .c{width:26px;height:26px;border-radius:50%;background:var(--app-surface-2);color:var(--ink-3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}
.pub-step.active .c{background:var(--accent);color:#fff}
.pub-step.done .c{background:var(--success);color:#fff}
.pub-step .lb{font-size:12px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.pub-step.active .lb,.pub-step.done .lb{color:var(--ink)}
.pub-step .ln{flex:1;height:2px;background:var(--app-border-strong);margin:0 8px}
.pub-step.done .ln{background:var(--success)}
.pub-panel{max-width:520px}
.publish-checklist{display:flex;flex-direction:column;gap:10px}
.pcheck-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;background:var(--app-surface-2);font-size:13px;font-weight:600}
.pcheck-item svg{width:15px;height:15px;color:var(--success)}
.radio-card{display:flex;gap:12px;padding:14px;border:1.5px solid var(--app-border-strong);border-radius:12px;cursor:pointer}
.radio-card.active{border-color:var(--accent);background:var(--accent-soft)}
.radio-card .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--app-border-strong);flex:none;margin-top:1px;position:relative}
.radio-card.active .dot{border-color:var(--accent)}
.radio-card.active .dot::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.radio-card .rt{font-weight:700;font-size:13.5px}
.radio-card .rd{font-size:12px;color:var(--ink-2);margin-top:2px}
.warn-callout{display:flex;gap:10px;background:var(--warning-soft);color:#7a5200;padding:12px 14px;border-radius:10px;font-size:12.5px;font-weight:600;line-height:1.5}
.warn-callout svg{width:16px;height:16px;flex:none;margin-top:1px}
.success-check{width:78px;height:78px;border-radius:50%;background:var(--success-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;animation:popIn .4s var(--ease)}
.success-check svg{width:34px;height:34px;color:var(--success)}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

/* Analytics */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.stat-tile{padding:20px}
.stat-tile .lbl{font-size:12px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.stat-tile .val{font-size:26px;font-weight:800;font-family:'Fraunces',serif;margin:8px 0 6px}
.stat-tile .delta{font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px}
.stat-tile .delta svg{width:11px;height:11px}
.delta.good{color:var(--viz-good)}
.delta.bad{color:var(--danger)}
.spark{margin-top:10px}
.chart-card{padding:24px;margin-bottom:18px}
.chart-card .ch-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.chart-card .ch-head h3{font-size:14.5px;font-weight:800}
.chart-legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-2);font-weight:600}
.chart-legend span{display:flex;align-items:center;gap:6px}
.chart-legend i{width:9px;height:9px;border-radius:2px}
.tooltip-box{position:absolute;background:#15140f;color:#fff;font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .1s;white-space:nowrap;z-index:5}
.two-col-charts{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.hbar-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.hbar-row .l{width:110px;font-size:12.5px;font-weight:600;color:var(--ink-2);flex:none}
.hbar-track{flex:1;height:20px;border-radius:5px;background:var(--app-surface-2);overflow:hidden}
.hbar-fill{height:100%;border-radius:5px;background:var(--viz-1)}
.hbar-row .v{width:38px;font-size:12px;font-weight:700;text-align:right}
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut-legend{display:flex;flex-direction:column;gap:9px}
.donut-legend .r{display:flex;align-items:center;gap:8px;font-size:12.5px}
.donut-legend i{width:9px;height:9px;border-radius:2px;flex:none}
.donut-legend .lv{font-weight:700;margin-left:auto;padding-left:16px}

@media(max-width:1100px){.lib-grid,.persona-grid,.stat-grid{grid-template-columns:repeat(2,1fr)}.two-col-charts{grid-template-columns:1fr}}
@media(max-width:820px){.sf-hide-mobile{display:none}}
</style>

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function getPath(obj, path){ return path.split('.').reduce((o,k)=>o&&o[k], obj); }
function setPath(obj, path, val){
  const parts = path.split('.'); const last = parts.pop();
  const target = parts.reduce((o,k)=>o[k], obj);
  target[last] = val;
}

function renderSection(sec, idx){

/* ============================================================
   MAIN RENDER
   ============================================================ */
function renderStorefront(){
  const root = document.getElementById('storefront');
  let html = addZoneHTML(0);
  storeState.sections.forEach((sec, i)=>{
    html += renderSection(sec, i);
    html += addZoneHTML(i+1);
  });
  root.innerHTML = html;
  applyDesignTokens();
  bindFaqToggles();
  startCountdowns();
  if(typeof applyImgMaps==='function') applyImgMaps();
  if(currentSelection) reapplySelectionClass();
}

function addZoneHTML(insertIdx){
  return `<div class="add-zone" data-add-idx="${insertIdx}"><button class="add-zone-btn" data-add-idx="${insertIdx}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Add section</button></div>`;
}

function bindFaqToggles(){
  document.querySelectorAll('.sf-faq-q').forEach(q=>{
    q.addEventListener('click', (e)=>{
      if(e.target.closest('[contenteditable="true"]')) return;
      q.parentElement.classList.toggle('open');
    });
  });
}

function startCountdowns(){
  document.querySelectorAll('[data-countdown]').forEach(box=>{
    let h=23,m=59,s=42;
    const tick=()=>{
      s--; if(s<0){s=59;m--;} if(m<0){m=59;h--;} if(h<0){h=23;m=59;s=59;}
      box.querySelector('[data-u="h"]').textContent=String(h).padStart(2,'0');
      box.querySelector('[data-u="m"]').textContent=String(m).padStart(2,'0');
      box.querySelector('[data-u="s"]').textContent=String(s).padStart(2,'0');
    };
    if(box._timer) clearInterval(box._timer);
    box._timer=setInterval(tick,1000);
  });
}

function applyDesignTokens(){
  const sf = document.getElementById('storefront');
  const d = designTokens;
  sf.style.setProperty('--s-primary', d.primary);
  sf.style.setProperty('--s-secondary', d.secondary);
  sf.style.setProperty('--s-bg', d.bg);
  sf.style.setProperty('--s-surface', d.surface);
  sf.style.setProperty('--s-ink', d.ink);
  sf.style.setProperty('--s-heading-font', d.headingFont);
  sf.style.setProperty('--s-body-font', d.bodyFont);
  sf.style.setProperty('--s-heading-weight', d.headingWeight);
  sf.style.setProperty('--s-radius', d.radius+'px');
  sf.style.setProperty('--s-img-radius', d.imgRadius+'px');
  sf.style.setProperty('--s-space', d.spacing);
  sf.style.setProperty('--s-base-size', d.baseSize+'px');
  sf.style.setProperty('--s-btn-radius', d.btnStyle==='pill'?'999px':d.btnStyle==='square'?'2px':'8px');

<script>
'use strict';
/* ============================================================
   TOASTS
   ============================================================ */
function toast(msg, icon){
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = `${icon||'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"/></svg>'}<span>${msg}</span>`;
  box.appendChild(el);
  setTimeout(()=>{ el.classList.add('leave'); setTimeout(()=>el.remove(),220); }, 2600);
}

/* ============================================================
   HISTORY / UNDO-REDO / CHANGE LOG
   ============================================================ */
let undoStack = [deepClone({sections:storeState.sections, design:designTokens})];
let undoPos = 0;
let changeLog = [
  {label:'AI generated your store', icon:'gen', time:'3 hours ago'},
  {label:'Design change: primary color', icon:'design', time:'2 hours ago'},
  {label:'Section added: Reviews', icon:'section', time:'2 hours ago'},
  {label:'Auto-saved', icon:'save', time:'58 minutes ago'},
];

function commitChange(label, icon){
  undoPos++;
  undoStack = undoStack.slice(0, undoPos);
  undoStack.push(deepClone({sections:storeState.sections, design:designTokens}));
  changeLog.unshift({label, icon: icon||'edit', time:'Just now'});
  updateUndoRedoButtons();
  flashSaving();
  if(document.getElementById('view-history').classList.contains('active')) renderHistoryView();
}

function applySnapshot(snap){
  storeState.sections = deepClone(snap.sections);
  designTokens = deepClone(snap.design);
  clearSelection();
  renderStorefront();
  if(document.getElementById('sidePanel').dataset.mode==='design') openDesignPanel();
}

function undo(){
  if(undoPos<=0) return;
  undoPos--;
  applySnapshot(undoStack[undoPos]);
  updateUndoRedoButtons();
  flashSaving();
  toast('Undid last change');
}
function redo(){
  if(undoPos>=undoStack.length-1) return;
  undoPos++;
  applySnapshot(undoStack[undoPos]);
  updateUndoRedoButtons();
  flashSaving();
  toast('Redid change');
}
function updateUndoRedoButtons(){
  document.getElementById('undoBtn').disabled = undoPos<=0;
  document.getElementById('redoBtn').disabled = undoPos>=undoStack.length-1;
}

let saveTimer=null;
function flashSaving(){
  const dot = document.querySelector('#saveStatus .pulse');
  const txt = document.getElementById('saveStatusText');
  dot.classList.add('saving'); txt.textContent='Saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ dot.classList.remove('saving'); txt.textContent='Saved just now'; }, 700);
}

const HIST_ICON = {
  gen:{bg:'var(--accent-soft)',color:'var(--accent)',svg:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/>'},

  section:{bg:'#e9f8e9',color:'#0ca30c',svg:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/>'},
  save:{bg:'var(--app-surface-2)',color:'var(--ink-3)',svg:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 3"/>'},
  edit:{bg:'var(--accent-soft)',color:'var(--accent)',svg:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>'},
  publish:{bg:'#e9f8e9',color:'#0ca30c',svg:'<path d="M4 12l6 6L20 6"/>'}

<script>
'use strict';
/* ============================================================
   SELECTION + FLOATING TEXT TOOLBAR
   ============================================================ */
let currentSelection = null; // {el, path, kind:'text'|'image'|'section', sectionIdx}
let currentDevice = 'desktop';

function clearSelection(){
  document.querySelectorAll('.is-selected').forEach(el=>el.classList.remove('is-selected'));
  document.querySelectorAll('[contenteditable="true"]').forEach(el=>el.setAttribute('contenteditable','false'));
  document.getElementById('floatToolbar').classList.remove('show');
  closeSidePanel();
  currentSelection = null;
}

function reapplySelectionClass(){
  if(!currentSelection) return;
  const sel = currentSelection;
  const el = document.querySelector(`[data-edit="${CSS.escape(sel.path)}"]`);
  if(el) el.classList.add('is-selected');
}

const canvasWrap = ()=>document.getElementById('canvasWrap');

document.addEventListener('click', (e)=>{
  const wrap = document.getElementById('canvasWrap');
  if(!wrap.contains(e.target)){
    if(!e.target.closest('.float-toolbar, .popover, .modal, .side-panel, .sec-ctrls')) {
      clearSelection();
    }
    return;
  }
  const editEl = e.target.closest('[data-editable]');
  const imgEl = e.target.closest('[data-image]');
  const ctrlBtn = e.target.closest('.sec-ctrls button');
  const secEl = e.target.closest('.sf-section');
  const addBtn = e.target.closest('.add-zone-btn');

  if(addBtn){ openSectionLibrary(parseInt(addBtn.dataset.addIdx)); return; }
  if(ctrlBtn){ handleSectionControl(ctrlBtn.dataset.act, secEl); return; }
  if(imgEl){ selectImage(imgEl); return; }
  if(editEl){ selectText(editEl); return; }
  if(secEl){ selectSection(secEl); return; }
});

function selectText(el){
  if(currentSelection && currentSelection.kind==='text' && currentSelection.el===el) return;
  clearSelection();
  const path = el.dataset.edit;
  currentSelection = {el, path, kind:'text'};
  el.classList.add('is-selected');
  el.setAttribute('contenteditable','true');
  el.focus();
  placeCaretAtEnd(el);
  positionFloatToolbar(el);
  renderFloatToolbar(el);
  document.getElementById('floatToolbar').classList.add('show');
}

function placeCaretAtEnd(el){
  const range = document.createRange(); range.selectNodeContents(el); range.collapse(false);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
}

function commitTextEdit(el){
  const path = el.dataset.edit;
  if(!path.startsWith('sections.')) return;
  const newVal = el.innerText;
  const old = getPath(storeState, path);
  if(old===newVal) return;
  setPath(storeState, path, newVal);
  commitChange('Edited text', 'edit');
}

document.addEventListener('focusout', (e)=>{
  const el = e.target.closest && e.target.closest('[data-editable][contenteditable="true"]');
  if(el) commitTextEdit(el);
}, true);

function positionFloatToolbar(el){
  const tb = document.getElementById('floatToolbar');
  const r = el.getBoundingClientRect();
  requestAnimationFrame(()=>{
    const tbR = tb.getBoundingClientRect();
    let top = r.top - tbR.height - 10;
    let left = r.left + r.width/2 - tbR.width/2;
    if(top < 8) top = r.bottom + 10;
    left = Math.max(8, Math.min(left, window.innerWidth - tbR.width - 8));
    tb.style.top = top+'px'; tb.style.left = left+'px';
  });
}

function renderFloatToolbar(el){
  const tb = document.getElementById('floatToolbar');
  const isBtn = el.dataset.btn==='1';
  tb.innerHTML = `
    <button class="ft-btn ai" data-ft="rewrite" title="One-click AI rewrite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/></svg>Rewrite</button>
    <button class="ft-btn" data-ft="aiedit" title="AI Edit with instructions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3z"/></svg>AI Edit</button>
    <div class="ft-sep"></div>
    <button class="ft-btn" data-ft="align" title="Align"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h12M3 18h18"/></svg></button>
    <button class="ft-btn" data-ft="size" title="Font size"><span style="font-weight:800;font-size:13px">A</span></button>
    <button class="ft-btn ${el.classList.contains('fw-bold')?'active':''}" data-ft="bold" title="Bold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h7a3.5 3.5 0 0 1 0 7H6zM6 11h8a3.5 3.5 0 0 1 0 7H6z"/></svg></button>
    <button class="ft-btn" data-ft="color" title="Color"><span style="width:13px;height:13px;border-radius:50%;background:${el.style.color||'currentColor'};border:1px solid rgba(255,255,255,.4);display:block"></span></button>
    <div class="ft-sep"></div>
    <button class="ft-btn" data-ft="more" title="More"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
  `;
}

document.getElementById('floatToolbar').addEventListener('mousedown', (e)=>{
  // prevent losing contentEditable focus/selection when clicking toolbar buttons
  if(e.target.closest('.ft-btn')) e.preventDefault();
});

document.getElementById('floatToolbar').addEventListener('click', (e)=>{
  const btn = e.target.closest('.ft-btn'); if(!btn || !currentSelection) return;
  const el = currentSelection.el; const act = btn.dataset.ft;
  if(act==='rewrite'){ doInlineAiRewrite(el, null); }
  else if(act==='aiedit'){ openAiPopover(el, btn); }
  else if(act==='align'){ cycleAlign(el); }
  else if(act==='size'){ cycleFontSize(el); }
  else if(act==='bold'){ el.classList.toggle('fw-bold'); el.style.fontWeight = el.classList.contains('fw-bold')?'800':''; commitChange('Formatted text','edit'); }
  else if(act==='color'){ openColorPopover(el, btn); }
  else if(act==='more'){ openMoreMenu(el, btn); }
});

function cycleAlign(el){
  const order=['left','center','right']; let cur = el.style.textAlign || 'left';
  let next = order[(order.indexOf(cur)+1)%order.length];
  el.style.textAlign = next; el.style.display = 'block';
  commitChange('Changed alignment','edit');
  positionFloatToolbar(el);
}
function cycleFontSize(el){
  const order=['','1.15em','1.4em','1.7em'];
  let idx = order.indexOf(el.dataset.fsz||'');
  idx = (idx+1)%order.length;
  el.dataset.fsz = order[idx];
  el.style.fontSize = order[idx] || '';
  commitChange('Changed font size','edit');
  positionFloatToolbar(el);
}
</script>
<script>
'use strict';
/* ============================================================
   AI SIMULATION ENGINE
   ============================================================ */
const AI_POOL = {
  heading:{
    default:['Travel Light. Arrive Ready.','Built for the Journey Ahead.','Everything You Need. Nothing You Don’t.','Made for Movement.'],
    premium:'Considered Travel, Refined.',
    concise:'Travel, Simplified.',
    playful:'Pack Smart. Wander Far. ✈️',
    bold:'Your Next Trip Starts Here.',
    warm:'A Bag That Feels Like Home, Anywhere.'
  },
  paragraph:{
    default:['Thoughtfully engineered from full-grain leather to carry everything you need — and nothing you don’t.','Every stitch, strap, and pocket is designed around how people actually travel.','Crafted in small batches from materials built to outlast the trip — and the next hundred.','Considered details, honest materials, and a fit that works for real itineraries.'],
    premium:'Hand-finished in full-grain leather, engineered with quiet, uncompromising precision.',
    concise:'Full-grain leather. Smart storage. Built to last.',
    playful:'Your new travel bestie — it holds everything, judges nothing.',
    bold:'The last travel bag you’ll ever need to buy. Period.',
    warm:'Designed with care, so every trip feels a little more like home.'
  },
  cta:{
    default:['Shop the Jenni Bag','Discover the Bag','Explore Jenni','Get Yours Today'],
    premium:'Shop the Collection',
    concise:'Shop Now',
    playful:'Let’s Pack! 🎒',
    bold:'Claim Yours Now',
    warm:'Find Your Jenni Bag'
  }
};
let aiCycle = {};
function categorize(el){
  if(el.tagName==='BUTTON') return 'cta';
  if(el.tagName==='H1'||el.tagName==='H2') return 'heading';
  return 'paragraph';
}
function detectTone(instr){
  if(!instr) return null;
  const t = instr.toLowerCase();
  if(/premium|luxur|elevat|refined|sophisticat/.test(t)) return 'premium';
  if(/concise|short|shorter|tight|brief|punchy/.test(t)) return 'concise';
  if(/fun|playful|casual|quirky|witty/.test(t)) return 'playful';
  if(/bold|urgent|sale|exciting|energetic|strong/.test(t)) return 'bold';
  if(/warm|friendly|invit|cozy|welcom/.test(t)) return 'warm';
  return null;
}
function aiGenerate(el, instr){
  const cat = categorize(el);
  const pool = AI_POOL[cat] || AI_POOL.paragraph;
  const tone = detectTone(instr);
  const path = el.dataset.edit;
  aiCycle[path] = (aiCycle[path]||0);
  if(tone && pool[tone] && pool[tone] !== el.innerText.trim()){
    return pool[tone];
  }
  const arr = pool.default;
  aiCycle[path] = (aiCycle[path]+1) % arr.length;
  let candidate = arr[aiCycle[path]];
  if(candidate === el.innerText.trim()){ aiCycle[path]=(aiCycle[path]+1)%arr.length; candidate = arr[aiCycle[path]]; }
  return candidate;
}

function doInlineAiRewrite(el, instr){
  el.style.opacity='.35';
  const tb = document.getElementById('floatToolbar');
  tb.style.pointerEvents='none';
  setTimeout(()=>{
    const newText = aiGenerate(el, instr);
    el.innerText = newText;
    el.style.opacity='1';
    tb.style.pointerEvents='auto';
    const path = el.dataset.edit;
    if(path.startsWith('sections.')) setPath(storeState, path, newText);
    commitChange('AI rewrite', 'gen');
    flashGreen(el);
    toast('Updated with AI');
    if(currentSelection && currentSelection.el===el) positionFloatToolbar(el);
  }, 950);
}
function flashGreen(el){
  el.style.transition='background .6s ease';
  el.style.background='rgba(12,163,12,.14)';
  setTimeout(()=>{ el.style.background=''; }, 700);
}

/* ---- AI Edit popover (element-level, custom instruction) ---- */
function openAiPopover(el, anchorBtn){

  pop.innerHTML = `
    <div class="pop-head"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/></svg></span><span class="tt">AI Edit</span><button class="close" id="aiPopClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>

      <textarea id="aiPopInput" placeholder="e.g. Make this heading more premium and concise">${categorize(el)==='heading'?'Make this heading more premium and concise':''}</textarea>
      <div class="pop-chips">
        <button class="chip" data-p="premium">Premium</button>
        <button class="chip" data-p="concise">Concise</button>
        <button class="chip" data-p="playful">Playful</button>
        <button class="chip" data-p="bold">Bold</button>
        <button class="chip" data-p="warm">Warm</button>
      </div>
      <div id="aiPopAction"><button class="btn btn-accent btn-block" id="aiPopGenerate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/></svg>Generate</button></div>
    </div>`;
  pop.style.top = (r.bottom+8)+'px'; pop.style.left = Math.max(8, Math.min(r.left-90, window.innerWidth-336))+'px';
  pop.classList.add('show');
  document.getElementById('aiPopClose').onclick = ()=>pop.classList.remove('show');
  pop.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    pop.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    const ta = document.getElementById('aiPopInput');
    ta.value = `Make this ${c.dataset.p==='premium'?'more premium':c.dataset.p==='concise'?'more concise':c.dataset.p==='playful'?'more playful':c.dataset.p==='bold'?'bolder':'warmer'}`;

  document.getElementById('aiPopGenerate').onclick = ()=>{

    setTimeout(()=>{

}

/* ---- Color popover ---- */
const TEXT_COLORS = ['#211f1a','#c1502e','#6b6558','#ffffff','#0ca30c','#2a78d6','#e87ba4','#eda100','#21201b','#898781','#d03b3b','#5b4fe9'];

function openMoreMenu(el, anchorBtn){

/* ---- Reposition (focal point) ---- */
function openRepositionModal(el){
  const inner = document.getElementById('repositionModalInner');
  const path = el.dataset.edit;
  let pos = imgPosMap[path] || {x:50,y:50};
  inner.innerHTML = `
    <div class="modal-head"><div><div class="tt">Reposition Image</div><div class="st">Drag the point to set the focal area</div></div><button class="modal-close" data-close="repositionModal">${ICONS.x}</button></div>
    <div class="modal-body">
      <div id="repoBox" style="position:relative;border-radius:12px;overflow:hidden;cursor:crosshair;user-select:none">
        <img id="repoImg" src="${el.querySelector('img').src}" style="width:100%;height:260px;object-fit:cover;object-position:${pos.x}% ${pos.y}%">
        <div id="repoDot" style="position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.3);left:${pos.x}%;top:${pos.y}%;transform:translate(-50%,-50%);pointer-events:none"></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" data-close="repositionModal">Cancel</button><button class="btn btn-primary" id="applyRepo">Apply</button></div>`;
  bindModalClose(inner);
  const box = inner.querySelector('#repoBox'), dot = inner.querySelector('#repoDot'), img = inner.querySelector('#repoImg');
  let dragging=false;
  const setFromEvent = (e)=>{
    const r = box.getBoundingClientRect();
    const cx = (e.touches? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches? e.touches[0].clientY : e.clientY) - r.top;
    pos.x = Math.max(0,Math.min(100, cx/r.width*100));
    pos.y = Math.max(0,Math.min(100, cy/r.height*100));
    dot.style.left=pos.x+'%'; dot.style.top=pos.y+'%';
    img.style.objectPosition = pos.x+'% '+pos.y+'%';
  };
  box.addEventListener('mousedown', e=>{ dragging=true; setFromEvent(e); });
  window.addEventListener('mousemove', e=>{ if(dragging) setFromEvent(e); });
  window.addEventListener('mouseup', ()=>dragging=false);
  document.getElementById('applyRepo').onclick = ()=>{
    imgPosMap[path]=pos;
    el.querySelector('img').style.objectPosition = pos.x+'% '+pos.y+'%';
    commitChange('Repositioned image','edit');
    toast('Image repositioned');
    closeModal('repositionModal');
  };
  openModal('repositionModal');
}

function bindModalClose(inner){
  inner.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));
}

/* ============================================================
   SECTION SELECTION + CONTROLS
   ============================================================ */
function selectSection(secEl){
  clearSelection();
  const idx = parseInt(secEl.dataset.sectionIdx);
  currentSelection = {el:secEl, kind:'section', sectionIdx: idx};
  secEl.classList.add('is-selected');
}

function handleSectionControl(act, secEl){
  const idx = parseInt(secEl.dataset.sectionIdx);
  selectSection(secEl);
  if(act==='edit') openSectionPanel(idx, 'content');
  else if(act==='settings') openSectionPanel(idx, 'settings');
  else if(act==='ai') openSectionAiPopover(idx, secEl);
  else if(act==='up') moveSection(idx, -1);
  else if(act==='down') moveSection(idx, 1);
  else if(act==='dup') duplicateSection(idx);
  else if(act==='del') confirmDeleteSection(idx);
}

function moveSection(idx, dir){
  const arr = storeState.sections; const j = idx+dir;
  if(j<0 || j>=arr.length) return;
  [arr[idx], arr[j]] = [arr[j], arr[idx]];
  commitChange('Reordered sections','section');
  renderStorefront();
  const el = document.querySelector(`[data-section-idx="${j}"]`);
  if(el){ selectSection(el); flashSection(el); el.scrollIntoView({behavior:'smooth', block:'center'}); }
}

function duplicateSection(idx){
  const clone = deepClone(storeState.sections[idx]);
  clone.id = clone.id+'-copy-'+Math.floor(Math.random()*10000);
  storeState.sections.splice(idx+1, 0, clone);
  commitChange('Duplicated section','section');
  renderStorefront();
  const el = document.querySelector(`[data-section-idx="${idx+1}"]`);
  if(el){ selectSection(el); flashSection(el); el.scrollIntoView({behavior:'smooth', block:'center'}); }
  toast('Section duplicated');
}

function confirmDeleteSection(idx){
  const sec = storeState.sections[idx];
  showConfirm({
    title:'Delete this section?',
    body:`“${SEC_LABELS[sec.type]||sec.type}” will be removed from your store. You can undo this any time.`,
    confirmLabel:'Delete', danger:true,
    onConfirm:()=>{
      storeState.sections.splice(idx,1);
      commitChange('Deleted section','section');
      clearSelection();
      renderStorefront();
      toast('Section deleted');
    }
  });
}

function flashSection(el){ el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'), 1000); }
function reselectSectionByIdx(idx){
  const el = document.querySelector(`[data-section-idx="${idx}"]`);
  if(el){ el.classList.add('is-selected'); currentSelection = {el, kind:'section', sectionIdx: idx}; }
}

<script>
'use strict';
/* ============================================================
   RIGHT PANEL: SECTION CONTENT / SETTINGS
   ============================================================ */
function openSidePanel(){ document.getElementById('sidePanel').classList.add('open'); }
function closeSidePanel(){ const sp=document.getElementById('sidePanel'); sp.classList.remove('open'); sp.dataset.mode=''; }

function bindTextField(input, path, isTextarea){
  input.addEventListener('input', ()=>{

    if(el && el!==input) el.innerText = input.value;
  });

function openSectionPanel(idx, mode){
  const sec = storeState.sections[idx];
  const sp = document.getElementById('sidePanel');
  sp.dataset.mode = mode==='settings' ? 'sectionSettings' : 'sectionContent';
  sp.dataset.idx = idx;
  document.getElementById('spHead').innerHTML = `
    <span class="sp-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${mode==='settings'?'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82"/>':'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>'}</svg></span>

  document.getElementById('spClose').onclick = closeSidePanel;

  const body = document.getElementById('spBody');
  if(mode==='content') body.innerHTML = sectionContentFieldsHTML(sec, idx);
  else body.innerHTML = sectionSettingsFieldsHTML(sec, idx);
  openSidePanel();

  if(mode==='content'){
    body.querySelectorAll('[data-field-path]').forEach(inp=>bindTextField(inp, inp.dataset.fieldPath, inp.tagName==='TEXTAREA'));

    if(imgBtn) imgBtn.onclick = ()=>{ const target = document.querySelector(`[data-edit="${CSS.escape(imgBtn.dataset.path)}"]`); if(target) openImagePickModal(target); };
  } else {
    body.querySelectorAll('.swatch[data-bg]').forEach(sw=>sw.onclick=()=>{
      body.querySelectorAll('.swatch[data-bg]').forEach(x=>x.classList.remove('active')); sw.classList.add('active');

      commitChange('Section background changed','design'); renderStorefront(); reselectSectionByIdx(idx);

function fieldRow(label, path, val, textarea){
  return `<div class="field"><label>${label}</label>${textarea?`<textarea data-field-path="${path}">${val||''}</textarea>`:`<input type="text" data-field-path="${path}" value="${(val||'').replace(/"/g,'&quot;')}">`}</div>`;
}

function sectionContentFieldsHTML(sec, idx){
  let html = `<div class="sp-section"><div class="sp-label">Content</div>`;
  const p = s=>`sections.${idx}.${s}`;
  if('eyebrow' in sec) html += fieldRow('Eyebrow', p('eyebrow'), sec.eyebrow);
  if('heading' in sec) html += fieldRow('Heading', p('heading'), sec.heading, true);
  if('sub' in sec) html += fieldRow('Subheading', p('sub'), sec.sub, true);
  if('cta' in sec) html += fieldRow('Button text', p('cta'), sec.cta);
  if(sec.type==='features'){
    html += fieldRow('Product name', p('product.name'), sec.product.name);
    html += fieldRow('Price', p('product.price'), sec.product.price);
  }
  html += `</div>`;
  const imgPath = sec.type==='hero' ? p('image') : sec.type==='banner' ? p('image') : sec.type==='features' ? p('product.images.0') : null;
  if(imgPath){
    html += `<div class="sp-section"><div class="sp-label">Image</div><button class="btn btn-soft btn-block" id="spChangeImg" data-path="${imgPath}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>Change Image</button></div>`;
  }
  if(['features','benefits','reviews','faq','gallery','comparison','howitworks'].includes(sec.type)){
    html += `<div class="sp-section"><div class="sp-label">Items</div><div style="font-size:12px;color:var(--ink-3);line-height:1.6;background:var(--app-surface-2);padding:10px 12px;border-radius:10px">Click any card, quote, or answer directly in the preview to edit it in place.</div></div>`;
  }
  return html;
}

function sectionSettingsFieldsHTML(sec, idx){
  const cur = sec.styleBg || 'none';
  return `
  <div class="sp-section">
    <div class="sp-label">Background</div>
    <div class="swatch-row">
      <span class="swatch ${cur==='none'?'active':''}" data-bg="none" style="background:repeating-linear-gradient(45deg,#eee,#eee 4px,#fff 4px,#fff 8px)" title="Default"></span>

      items:[{q:'Add your question here',a:'Add your answer here.'},{q:'Add your question here',a:'Add your answer here.'}]};

function openSectionLibrary(insertIdx){

        <div class="tt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/></svg>Create Section with AI</div>
        <div class="st">Describe the section you want — layout, content, and copy generated in seconds.</div>

    document.getElementById('libAiStatus').innerHTML = `<div class="ai-loading" style="color:rgba(255,255,255,.9);margin-top:10px"><span class="spinner" style="border-color:rgba(255,255,255,.3);border-top-color:#fff"></span>Generating your section…</div>`;
    setTimeout(()=>{
      const sec = generateAiSection(prompt);
      insertSection(insertIdx, sec);
      closeModal('sectionLibModal');
    }, 1400);
  };
  openModal('sectionLibModal');
}

function generateAiSection(prompt){
  const tone = detectTone(prompt) || 'default';
  const isCountdown = /countdown|sale|deal|limited|urgen/i.test(prompt);
  const isBanner = /banner|promo/i.test(prompt);
  const type = isCountdown ? 'countdown' : isBanner ? 'banner' : 'custom';
  const short = prompt.length>62 ? prompt.slice(0,60)+'…' : prompt;
  const headingByTone = {
    premium:'Considered Details, Elevated Travel', concise: short.charAt(0).toUpperCase()+short.slice(1),
    playful:'Let’s Make This Trip One to Remember 🎒', bold:'Don’t Miss This — Shop Now', warm:'Made With You In Mind',
    default: short.charAt(0).toUpperCase()+short.slice(1)
  };
  if(type==='countdown') return {...newSectionContent('countdown'), heading: headingByTone[tone]};
  if(type==='banner') return {...newSectionContent('banner'), heading: headingByTone[tone]};
  return {id:'custom-'+Math.floor(Math.random()*100000), type:'custom', eyebrow:'AI Generated',
    heading: headingByTone[tone], sub:'Generated from your prompt — edit any line or ask AI to refine it further.', cta:'Learn More'};
}

function insertSection(idx, secObj){
  storeState.sections.splice(idx, 0, secObj);
  commitChange('Added section', 'section');
  renderStorefront();
  const el = document.querySelector(`[data-section-idx="${idx}"]`);
  if(el){ el.scrollIntoView({behavior:'smooth', block:'center'}); flashSection(el); selectSection(el); }
  toast('Section added');
}

<script>
'use strict';
/* ============================================================

   ============================================================ */
const FONT_OPTIONS = [
  {v:"'Fraunces',serif", n:'Fraunces'}, {v:"'Playfair Display',serif", n:'Playfair Display'},
  {v:"'Inter',sans-serif", n:'Inter'}, {v:"'Poppins',sans-serif", n:'Poppins'}, {v:"'DM Sans',sans-serif", n:'DM Sans'}
];
const PRESET_PALETTES = [
  {name:'Terracotta', primary:'#c1502e', secondary:'#21201b', bg:'#faf7f2'},
  {name:'Forest', primary:'#2f5233', secondary:'#1a1f16', bg:'#f6f5ef'},

  {name:'Rose', primary:'#b8546b', secondary:'#241a1d', bg:'#fbf4f4'},
  {name:'Slate', primary:'#3a6ea5', secondary:'#161c22', bg:'#f4f6f8'}
];

function openDesignPanel(){
  goToView('editor');
  clearSelection();
  const sp = document.getElementById('sidePanel');
  sp.dataset.mode = 'design';
  document.getElementById('spHead').innerHTML = `
    <span class="sp-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.4-.3-.4-.5-.9-.5-1.4 0-1.1.9-2 2-2h2.4c2.3 0 4.1-1.8 4.1-4.1C21.5 6 17.2 2 12 2z"/></svg></span>
    <div class="sp-head-text"><div class="t">Design</div><div class="s">Applies to your whole store</div></div>
